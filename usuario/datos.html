<!DOCTYPE html>
<head>

    <title>Invernadero - Datos</title>

</head>
<body>

    <h1>Datos de Sensores</h1>

    <nav>
        <a href="inicio.html">Inicio</a>
        <a href="invernadero.html">Invernadero</a>
        <a href="creacion.html">Agregar</a>
        <a href="datos.html">Datos</a>
        <a href="../index.html">Cerrar sesión</a>
    </nav>

    <label for="selectorSensor">Selecciona un sensor:</label>
    <select id="selectorSensor" onchange="mostrarGrafico()">
        <option value="temperatura">Sensor Temperatura 1</option>
        <option value="humedad">Sensor Humedad 1</option>
        <option value="riego">Sensor Riego 1</option>
    </select>

    <canvas id="graficoSensor" width="400" height="200"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script>

        const datosSensores = {
            temperatura: [18, 20, 22, 21, 23, 24, 22],
            humedad: [60, 62, 58, 65, 63, 61, 64],
            riego: [5, 6, 4, 7, 5, 6, 5]
        };

        const etiquetas = ["Día 1", "Día 2", "Día 3", "Día 4", "Día 5", "Día 6", "Día 7"];

        let grafico;

        function mostrarGrafico() {
            const sensorSeleccionado = document.getElementById("selectorSensor").value;
            const datos = datosSensores[sensorSeleccionado];

            if (grafico) {
                grafico.destroy();
            }

            const ctx = document.getElementById("graficoSensor");
            grafico = new Chart(ctx, {
                type: "line",
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: "Valor captado",
                        data: datos,
                        borderColor: "green",
                        fill: false
                    }]
                }
            });
        }

        mostrarGrafico();
    </script>

</body>
</html>
